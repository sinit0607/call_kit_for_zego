name: call_kit_for_zego_example
description: Example app demonstrating RTC Call Kit usage
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # The package we're demonstrating
  call_kit_for_zego:
    path: ../

  # Socket.IO for signaling (replace with your socket implementation)
  socket_io_client: ^3.1.2

  # Runtime mic/camera permissions. Deliberately NOT a dependency of
  # call_kit_for_zego itself — requesting permissions is the app's job, and apps
  # should be free to use whatever they already have. Without this, ZEGO joins
  # the room and publishes a silent stream: the call looks connected and
  # carries nothing.
  # Pinned to 11.x deliberately: permission_handler 13's Android artifact
  # requires compileSdk 37, which Android Gradle Plugin 9.0.1 does not support
  # (it caps at 36). The 11.x line targets 34 and builds everywhere. Raise this
  # once AGP supports 37.
  permission_handler: ^11.4.0

  # Optional: for state management
  # get: ^4.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
